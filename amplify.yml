# Amplify monorepo: appRoot must match env AMPLIFY_MONOREPO_APP_ROOT=frontend
# Rewrites at application scope (same pattern as customHeaders in AWS monorepo docs).
version: 1
applications:
  - appRoot: frontend
    customRules:
      # Path-only redirects (host/HTTP→HTTPS and www→apex via public/_redirects + Amplify domain settings).
      - source: '/home'
        target: '/'
        status: '301'
      - source: '/index'
        target: '/'
        status: '301'
      - source: '/index.html'
        target: '/'
        status: '301'
      # Public SEO routes: serve generated route HTML before the SPA fallback.
      - source: '/demo'
        target: '/demo/index.html'
        status: '200'
      - source: '/pricing'
        target: '/pricing/index.html'
        status: '200'
      - source: '/faq'
        target: '/faq/index.html'
        status: '200'
      - source: '/about'
        target: '/about/index.html'
        status: '200'
      - source: '/contact'
        target: '/contact/index.html'
        status: '200'
      - source: '/privacy'
        target: '/privacy/index.html'
        status: '200'
      - source: '/disclaimer'
        target: '/disclaimer/index.html'
        status: '200'
      - source: '/platform'
        target: '/platform/index.html'
        status: '200'
      - source: '/audit'
        target: '/audit/index.html'
        status: '200'
      - source: '/solutions'
        target: '/solutions/index.html'
        status: '200'
      - source: '/guides'
        target: '/guides/index.html'
        status: '200'
      - source: '/blog'
        target: '/blog/index.html'
        status: '200'
      - source: '/site-map'
        target: '/site-map/index.html'
        status: '200'
      - source: '/why-your-channel-gets-no-views'
        target: '/why-your-channel-gets-no-views/index.html'
        status: '200'
      - source: '/how-to-get-more-youtube-views'
        target: '/how-to-get-more-youtube-views/index.html'
        status: '200'
      - source: '/youtube-thumbnail-mistakes'
        target: '/youtube-thumbnail-mistakes/index.html'
        status: '200'
      - source: '/low-ctr-on-youtube'
        target: '/low-ctr-on-youtube/index.html'
        status: '200'
      - source: '/youtube-seo-for-small-channels'
        target: '/youtube-seo-for-small-channels/index.html'
        status: '200'
      - source: '/free-youtube-channel-audit'
        target: '/free-youtube-channel-audit/index.html'
        status: '200'
      - source: '/youtube-title-generator'
        target: '/youtube-title-generator/index.html'
        status: '200'
      - source: '/increase-youtube-watch-time'
        target: '/increase-youtube-watch-time/index.html'
        status: '200'
      - source: '/youtube-retention-analysis'
        target: '/youtube-retention-analysis/index.html'
        status: '200'
      - source: '/youtube-thumbnail-ctr'
        target: '/youtube-thumbnail-ctr/index.html'
        status: '200'
      - source: '/vidiq-alternative'
        target: '/vidiq-alternative/index.html'
        status: '200'
      - source: '/tubebuddy-alternative'
        target: '/tubebuddy-alternative/index.html'
        status: '200'
      - source: '/best-youtube-audit-tool'
        target: '/best-youtube-audit-tool/index.html'
        status: '200'
      - source: '/compare/<*>'
        target: '/compare/<*>/index.html'
        status: '200'
      - source: '/audit/<*>'
        target: '/audit/<*>/index.html'
        status: '200'
      - source: '/solutions/<*>'
        target: '/solutions/<*>/index.html'
        status: '200'
      - source: '/guides/<*>'
        target: '/guides/<*>/index.html'
        status: '200'
      - source: '/blog/<*>'
        target: '/blog/<*>/index.html'
        status: '200'
      - source: '/<*>'
        target: '/index.html'
        status: '200'
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: Cache-Control
            value: no-cache
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
