# Amplify build spec — app lives in frontend/ (set AMPLIFY_MONOREPO_APP_ROOT=frontend in app env)
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      customHeaders:
        - pattern: '**/*'
          headers:
            - key: Cache-Control
              value: no-cache
      # SPA fallback so deep links (/demo, /admin/login, /dashboard, …) serve index.html.
      # If Amplify shows 404 for a route, confirm this build spec is applied (monorepo app root = frontend).
      customRules:
        - source: '/<*>'
          target: '/index.html'
          status: 200
