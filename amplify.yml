# Amplify monorepo: appRoot must match env AMPLIFY_MONOREPO_APP_ROOT=frontend
# Rewrites at application scope (same pattern as customHeaders in AWS monorepo docs).
version: 1
applications:
  - appRoot: frontend
    customRules:
      - source: '/<*>'
        target: '/index.html'
        status: '200'
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: Cache-Control
            value: no-cache
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
