# Amplify build spec — app lives in frontend/ (set AMPLIFY_MONOREPO_APP_ROOT=frontend in app env)
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      customHeaders:
        - pattern: '**/*'
          headers:
            - key: Cache-Control
              value: no-cache
      # SPA: rewrite non-asset paths to index.html (AWS-recommended regex so /admin/login/ works).
      # See https://docs.aws.amazon.com/amplify/latest/userguide/redirect-rewrite-examples.html
      customRules:
        - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>'
          target: '/index.html'
          status: 200