name: YouTubeBooster Daily Growth Automation

on:
  schedule:
    # 3 daily cloud slots (UTC), every day including weekends.
    # Rough ET (DST ±1h): ~8 AM, ~11 AM, ~2 PM. Primary = Cursor; Windows Task = local backup.
    # SSM last-admin-report dedupes Admin email the same ET day.
    - cron: '0 13 * * *'
    - cron: '0 16 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (preview without sending emails)'
        type: boolean
        default: false
      force:
        description: 'Force run outreach even on weekend'
        type: boolean
        default: false
      max_sends:
        description: 'Maximum prospects to draft / send (approved only)'
        type: number
        default: 100

jobs:
  daily-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    env:
      HAS_AWS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure AWS credentials (OIDC role)
        id: aws_oidc
        if: ${{ vars.AWS_GROWTH_ROLE_ARN != '' }}
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GROWTH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configure AWS credentials (access keys fallback)
        if: ${{ steps.aws_oidc.outcome != 'success' && env.HAS_AWS_KEYS == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install growth dependencies
        working-directory: scripts/growth
        run: npm ci

      - name: Run daily growth job
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ inputs.max_sends }}" ]; then ARGS="$ARGS --max ${{ inputs.max_sends }}"; fi
          node scripts/growth/run-daily-growth-job.mjs $ARGS

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-run-logs-${{ github.run_id }}
          path: docs/growth/logs/
          if-no-files-found: ignore
